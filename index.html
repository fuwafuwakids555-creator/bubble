<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>バブルボール＆ふわふわ タイマー</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#111111">


<style>

h1{font-size:26px;margin-bottom:6px}

#deviceLabel{margin:4px 0}

#networkStatus{font-size:18px;font-weight:bold;padding:8px 12px;border-radius:10px;display:inline-block;margin:6px 4px}

.online{background:#d9f7d9;color:#087a08}

.offline{background:#ffd6d6;color:#b00020}

#controls{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;font-size:16px}

#timerCount,#startNumber,#playMode{font-size:16px;padding:2px;width:90px}

#createBtn,#salesBtn,#hideSalesBtn,#deviceBtn,#flushBtn{font-size:22px;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:bold;margin:8px 4px}

#flushBtn{background:#2196f3;color:white}

#salesBtn{background:#111;color:white}

#hideSalesBtn{background:#666;color:white;display:none}

#timers{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:15px;width:100%;margin-top:6px}

.timer{text-align:center}

button.timerBtn{width:100%;height:70px;font-size:40px;font-weight:bold;border-radius:16px;cursor:pointer;padding:0}

.waiting{background:#808080;color:white}

.running{background:green;color:white}

.finished{background:red;color:white}

.callBtn{margin-top:4px;width:100%;height:38px;font-size:18px;background:#ff9800;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

.callBtnQueued{background:#ffd600!important;color:#000!important;border:3px solid #ff9800!important;animation:waitingBlink .9s infinite}

.callBtnPlaying{background:#2ecc71!important;color:white!important;border:3px solid #1f8f4d!important}

@keyframes waitingBlink{0%,100%{background:#ffd600}50%{background:#fff176}}

.refundBtn{background:#b00020;color:white;font-size:24px!important}

.yenBtn{background:#ff9800;color:white;font-size:24px!important}

.ownerBtn{background:#673ab7;color:white;font-size:21px!important}

.changeBtn{background:#00897b;color:white;font-size:21px!important}

.timeRow{display:flex;justify-content:center;align-items:center;gap:4px;margin:4px 0}

.timeRow label,.timeRow select{font-size:18px}

.timeRow select{padding:2px 4px}

.displayText,.displayUp{font-size:18px;margin-top:2px;font-weight:bold}

@keyframes blink{0%,100%{color:red}50%{color:transparent}}

.blink{animation:blink 1s step-start infinite;font-weight:bold}

#summary,#dailySummary{display:none;margin-top:14px;border-top:1px solid #ccc;padding-top:8px;font-size:16px}

#summary h2,#dailySummary h2{font-size:20px;margin:6px 0}

#dailySummary input[type=date]{font-size:16px;margin-bottom:4px}

</style>

<script>

if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker.register('./sw.js', {

      updateViaCache:'none'

    }).catch(() => {});

  });

}

</script>
<style>
/* ボタン表示修正：2026-10-10 */
button {
  box-sizing: border-box;
}

button.timerBtn {
  min-height: 70px;
  height: auto;
  line-height: 1.2;
  padding: 8px 2px;
}

button.callBtn {
  min-height: 40px;
  height: auto;
  padding: 8px 2px;
  font-size: clamp(11px, 1.7vw, 18px);
  line-height: 1.3;
  white-space: nowrap;
}

button.timerBtn.refundBtn,
button.timerBtn.yenBtn,
button.timerBtn.changeBtn,
button.timerBtn.ownerBtn {
  font-size: clamp(13px, 2vw, 21px) !important;
  line-height: 1.4;
  white-space: nowrap;
}

.timeRow {
  flex-direction: column;
  gap: 2px;
}

.timeRow label {
  font-size: 14px;
  white-space: nowrap;
}

.timeRow select {
  box-sizing: border-box;
  width: 100%;
  max-width: 100px;
  min-width: 0;
  font-size: 16px;
}

@media (max-width: 600px) {
  #timers {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  button.callBtn {
    font-size: 13px;
  }

  button.timerBtn.refundBtn,
  button.timerBtn.yenBtn,
  button.timerBtn.changeBtn,
  button.timerBtn.ownerBtn {
    font-size: 16px !important;
  }
}
</style>
</head>

<body>

<div style="margin:10px 4px 14px;padding:14px 16px;background:#fff3cd;border:3px solid #ff9800;border-radius:12px;font-size:22px;font-weight:bold;line-height:1.6;color:#111">

⚠️ 一万円札が入ったときは「一万円札」ボタンを押してください。<br>

営業終了後に枚数確認いたします。

</div>

<h1>バブルボール＆ふわふわ タイマー</h1>

<h2 id="deviceLabel"></h2>

<div id="networkStatus">確認中</div>

<div id="controls">

<label for="timerCount">タイマー数:</label>

<select id="timerCount">

<option value="10">10</option>

<option value="15">15</option>

<option value="20">20</option>

<option value="25">25</option>

<option value="30" selected>30</option>

<option value="35">35</option>

<option value="40">40</option>

<option value="45">45</option>

<option value="50">50</option>

</select>

<label for="startNumber">開始番号:</label>

<input type="number" id="startNumber" value="1" min="1" max="999">

<label for="playMode">モード:</label>

<select id="playMode" onchange="savePlayMode()">

<option value="fuwafuwa">ふわふわ</option>

<option value="bubble">バブル</option>

</select>

<button id="createBtn" onclick="generateTimers()">個数確定</button>

<button id="deviceBtn" onclick="changeDeviceName()">端末名変更</button>

</div>

<div id="timers"></div>

<button id="flushBtn" onclick="flushOfflineQueue(true)">未送信を送信</button>

<button id="salesBtn" onclick="showSales()">売上を見る</button>

<button id="hideSalesBtn" onclick="hideSales()">売上を隠す</button>

<div id="summary">

<h2>今日の履歴と売上</h2>

<p>10分：<span id="count10">0回</span>（売上：<span id="fee10">0円</span>）</p>

<p>20分：<span id="count20">0回</span>（売上：<span id="fee20">0円</span>）</p>

<p>30分：<span id="count30">0回</span>（売上：<span id="fee30">0円</span>）</p>

<p>500円返金：<span id="refund500Count">0回</span>（返金：<span id="refund500Fee">0円</span>）</p>

<p>一万円札：<span id="yen10000Count">0回</span></p>

<h2>今日のキャンセル回数：<span id="cancelCount">0回</span></h2>

<h2>今日の売上合計：<span id="feeTotal">0円</span></h2>

</div>

<div id="dailySummary">

<h2>日付ごとの集計</h2>

<label for="summaryDate">集計日：</label>

<input type="date" id="summaryDate">

<p>10分：<span id="sum10">0回</span>（売上：<span id="sumFee10">0円</span>）</p>

<p>20分：<span id="sum20">0回</span>（売上：<span id="sumFee20">0円</span>）</p>

<p>30分：<span id="sum30">0回</span>（売上：<span id="sumFee30">0円</span>）</p>

<p>500円返金：<span id="sumRefund500">0回</span>（返金：<span id="sumRefund500Fee">0円</span>）</p>

<p>一万円札：<span id="sumYen10000">0回</span></p>

<p>キャンセル回数：<span id="sumCancel">0回</span></p>

<h2>その日の売上合計：<span id="sumFeeTotal">0円</span></h2>

</div>

<script>

// 更新日：2026-10-10

const GAS_URL = 'https://script.google.com/macros/s/AKfycbyT3SeO06Z5fpoZWbBZPmLrbEO88n7Dlx6vDhwwqJ5ZBIO-x7xSFAWKVXp88y6e_8d_aA/exec';

const SALES_PIN = '4181';

const SECOND_CALL_DELAY_MS = 180000;

const AUDIO_GAP_MS = 1000;

let DEVICE_NAME = localStorage.getItem('deviceName')

  || prompt('端末名を入力してください')

  || '未設定';

localStorage.setItem('deviceName', DEVICE_NAME);

let intervals = {};

let afterIntervals = {};

let timeoutHandles = {};

let activeCallToken = {};

let timerStates = {};

let audioQueue = [];

let audioPlaying = false;

let currentAudio = null;

let currentTask = null;

let currentFinish = null;

let press10 = 0;

let press20 = 0;

let press30 = 0;

let cancelCount = 0;

let refund500Count = 0;

let yen10000Count = 0;

let dailyStats = {};

let currentDateKey = '';

const el = id => document.getElementById(id);

function sleep(ms) {

  return new Promise(resolve => setTimeout(resolve, ms));

}

function getTodayKey() {

  const n = new Date();

  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;

}

function ensureCurrentDate() {

  const today = getTodayKey();

  if (today === currentDateKey) return;

  currentDateKey = today;

  loadTodayCountersFromDailyStats();

  if (el('summaryDate') && !el('summaryDate').value) {

    el('summaryDate').value = today;

  }

}

function yen(n) {

  return Number(n).toLocaleString('ja-JP') + '円';

}

function getPrice(m) {

  return m === 30 ? 1000 : (m === 10 || m === 20 ? 500 : 0);

}

function getItemKey(m) {

  return [10,20,30].includes(m) ? 'p'+m : '';

}

function readStored(key, fallback) {

  try {

    return JSON.parse(localStorage.getItem(key)

      || JSON.stringify(fallback)) || fallback;

  } catch (_) {

    return fallback;

  }

}

function getOfflineQueue() {

  return readStored('offlineSendQueue', []);

}

function saveOfflineQueue(queue) {

  localStorage.setItem('offlineSendQueue', JSON.stringify(queue));

  updateNetworkStatus();

}

function sendToSheet(data) {

  data._queuedAt = Date.now();

  data._deviceSavedName = DEVICE_NAME;

  if (!navigator.onLine) {

    const q = getOfflineQueue();

    q.push(data);

    saveOfflineQueue(q);

    return;

  }

  fetch(GAS_URL, {

    method:'POST',

    mode:'no-cors',

    headers:{'Content-Type':'text/plain;charset=utf-8'},

    body:JSON.stringify(data)

  }).catch(() => {

    const q = getOfflineQueue();

    q.push(data);

    saveOfflineQueue(q);

  });

}

function flushOfflineQueue(showMessage) {

  if (!navigator.onLine) {

    updateNetworkStatus();

    if (showMessage) {

      alert('オフライン中です。オンラインになってから送信します。');

    }

    return;

  }

  const q = getOfflineQueue();

  if (!q.length) {

    updateNetworkStatus();

    if (showMessage) alert('未送信データはありません');

    return;

  }

  fetch(GAS_URL, {

    method:'POST',

    mode:'no-cors',

    headers:{'Content-Type':'text/plain;charset=utf-8'},

    body:JSON.stringify(q)

  }).then(() => {

    localStorage.removeItem('offlineSendQueue');

    updateNetworkStatus();

    if (showMessage) {

      alert(q.length + '件の未送信データを送信しました');

    }

  }).catch(() => {

    updateNetworkStatus();

    if (showMessage) {

      alert('送信に失敗しました。データは保存されています。');

    }

  });

}

function updateNetworkStatus() {

  const node = el('networkStatus');

  if (!node) return;

  const count = getOfflineQueue().length;

  node.className = navigator.onLine ? 'online' : 'offline';

  node.textContent = navigator.onLine

    ? (count ? `オンライン・未送信 ${count}件` : 'オンライン・未送信なし')

    : `オフライン・未送信 ${count}件`;

}

window.addEventListener('online', () => {

  updateNetworkStatus();

  flushOfflineQueue(false);

  reconcileAllTimers();

});

window.addEventListener('offline', updateNetworkStatus);

function loadDailyStats() {

  dailyStats = readStored('bbTimerDailyStats', {});

}

function saveDailyStats() {

  localStorage.setItem('bbTimerDailyStats', JSON.stringify(dailyStats));

}

function loadTimerStates() {

  timerStates = readStored('bbTimerStates', {});

}

function saveTimerStates() {

  localStorage.setItem('bbTimerStates', JSON.stringify(timerStates));

}

function loadTodayCountersFromDailyStats() {

  const d = dailyStats[currentDateKey] || {};

  press10 = d.press10 || 0;

  press20 = d.press20 || 0;

  press30 = d.press30 || 0;

  cancelCount = d.cancel || 0;

  refund500Count = d.refund500 || 0;

  yen10000Count = d.yen10000 || 0;

  updateCountersDisplay();

}

function syncTodayToDailyStats() {

  ensureCurrentDate();

  dailyStats[currentDateKey] = {

    press10,press20,press30,

    cancel:cancelCount,

    refund500:refund500Count,

    yen10000:yen10000Count

  };

  saveDailyStats();

}

function setText(id, text) {

  if (el(id)) el(id).textContent = text;

}

function updateCountersDisplay() {

  setText('count10',press10+'回');

  setText('count20',press20+'回');

  setText('count30',press30+'回');

  setText('cancelCount',cancelCount+'回');

  setText('refund500Count',refund500Count+'回');

  setText('yen10000Count',yen10000Count+'回');

  setText('fee10',yen(press10*500));

  setText('fee20',yen(press20*500));

  setText('fee30',yen(press30*1000));

  setText('refund500Fee','-'+yen(refund500Count*500));

  setText('feeTotal',yen(

    press10*500+press20*500+press30*1000-refund500Count*500

  ));

  updateDailySummaryView(el('summaryDate')?.value || currentDateKey);

}

function updateDailySummaryView(dateKey) {

  const d = dailyStats[dateKey] || {};

  const a = d.press10 || 0;

  const b = d.press20 || 0;

  const c = d.press30 || 0;

  const r = d.refund500 || 0;

  setText('sum10',a+'回');

  setText('sum20',b+'回');

  setText('sum30',c+'回');

  setText('sumCancel',(d.cancel||0)+'回');

  setText('sumRefund500',r+'回');

  setText('sumYen10000',(d.yen10000||0)+'回');

  setText('sumFee10',yen(a*500));

  setText('sumFee20',yen(b*500));

  setText('sumFee30',yen(c*1000));

  setText('sumRefund500Fee','-'+yen(r*500));

  setText('sumFeeTotal',yen(a*500+b*500+c*1000-r*500));

}

function showSales() {

  sendToSheet({

    type:'sales_view',ts:Date.now(),device:DEVICE_NAME,

    page:'ふわふわタイマー',

    message:'売上を見るボタンが押されました'

  });

  if (prompt('暗証番号を入力してください') !== SALES_PIN) {

    alert('暗証番号が違います');

    return;

  }

  el('summary').style.display = 'block';

  el('dailySummary').style.display = 'block';

  el('hideSalesBtn').style.display = 'inline-block';

}

function hideSales() {

  el('summary').style.display = 'none';

  el('dailySummary').style.display = 'none';

  el('hideSalesBtn').style.display = 'none';

}

function refund500() {

  ensureCurrentDate();

  refund500Count++;

  syncTodayToDailyStats();

  updateCountersDisplay();

  sendToSheet({

    type:'sale',ts:Date.now(),device:DEVICE_NAME,

    key:'refund500',name:'500円返金',

    unitPrice:-500,qty:1,subtotal:-500

  });

}

function notifyButton(id,label,type,message) {

  const btn = el(id);

  if (btn) {

    btn.innerHTML = '送信中';

    btn.disabled = true;

  }

  sendToSheet({

    type,ts:Date.now(),device:DEVICE_NAME,

    page:'ふわふわタイマー',message

  });

  setTimeout(() => {

    if (btn) {

      btn.innerHTML = label;

      btn.disabled = false;

    }

  },1200);

}

function notifyYen10000() {

  ensureCurrentDate();

  yen10000Count++;

  syncTodayToDailyStats();

  updateCountersDisplay();

  notifyButton(

    'yen10000Btn','一万円札','yen10000',

    '一万円札が使用されました'

  );

}

function notifyOwner() {

  notifyButton(

    'ownerCallBtn','責任者<br>呼び出し','owner_call',

    '責任者呼び出しです'

  );

}

function notifyChange() {

  notifyButton('changeCallBtn','両替','change_call','両替の呼び出しです');

}

function isStillFinished(num,token) {

  const btn = el('btn'+num);

  const state = timerStates[num];

  return btn && state && state.status === 'finished'

    && btn.getAttribute('data-status') === 'finished'

    && activeCallToken[num] === token;

}

function stopCurrentAudioIfNum(num) {

  if (currentTask && currentTask.num === num && currentAudio) {

    try {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    } catch (_) {}

    if (currentFinish) currentFinish();

  }

}

function enqueueAudioTask(task) {

  audioQueue.push(task);

  updateCallButtonStates();

  runAudioQueue();

}

let runAudioQueue;

function updateCallButtonStates() {

  document.querySelectorAll('.callBtn').forEach(btn => {

    btn.classList.remove('callBtnQueued','callBtnPlaying');

    btn.disabled = false;

    btn.textContent = '🔊 呼び出し';

  });

  if (currentTask && currentTask.manual && currentTask.callBtn) {

    currentTask.callBtn.classList.add('callBtnPlaying');

    currentTask.callBtn.disabled = true;

    currentTask.callBtn.textContent = '▶ 再生中';

  }

  audioQueue.filter(t => t.manual && t.callBtn).forEach((t,i) => {

    t.callBtn.classList.add('callBtnQueued');

    t.callBtn.textContent = '待機中 '+(i+1);

  });

}

function messageFilesForMode() {

  return el('playMode').value === 'bubble'

    ? ['bubble.wav','バブル.wav']

    : ['fuwafuwa.wav','ふわふわ.wav'];

}

let enqueueFirstEndCall;

let enqueueSecondEndCall;

function callNumber(num,btn) {

  enqueueAudioTask({

    num,token:'manual_'+Date.now(),manual:true,

    requireFinished:false,callBtn:btn,files:[`${num}.wav`]

  });

}

function clearTimerHandles(num) {

  if (intervals[num]) clearInterval(intervals[num]);

  if (afterIntervals[num]) clearInterval(afterIntervals[num]);

  (timeoutHandles[num] || []).forEach(clearTimeout);

  intervals[num] = null;

  afterIntervals[num] = null;

  timeoutHandles[num] = [];

}

function removeCallsForNumber(num) {

  activeCallToken[num] = null;

  audioQueue = audioQueue.filter(t => t.num !== num);

  stopCurrentAudioIfNum(num);

  updateCallButtonStates();

}

function scheduleSecondCall(num) {

  const state = timerStates[num];

  if (!state || state.status !== 'finished' || state.secondCallDone) return;

  (timeoutHandles[num] || []).forEach(clearTimeout);

  const delay = Math.max(

    0,Number(state.finishedAt)+SECOND_CALL_DELAY_MS-Date.now()

  );

  timeoutHandles[num] = [

    setTimeout(() => processAutomaticCalls(num),delay)

  ];

}

let processAutomaticCalls;

function generateTimers() {

  Object.keys(intervals).forEach(k => clearInterval(intervals[k]));

  Object.keys(afterIntervals).forEach(k => clearInterval(afterIntervals[k]));

  Object.keys(timeoutHandles).forEach(k => {

    timeoutHandles[k].forEach(clearTimeout);

  });

  intervals = {};

  afterIntervals = {};

  timeoutHandles = {};

  activeCallToken = {};

  audioQueue = [];

  if (currentAudio) {

    try {

      currentAudio.pause();

      currentAudio.currentTime = 0;

    } catch (_) {}

    if (currentFinish) currentFinish();

  }

  currentTask = null;

  audioPlaying = false;

  updateCallButtonStates();

  const count = parseInt(el('timerCount').value,10) || 0;

  const start = parseInt(el('startNumber').value,10) || 1;

  localStorage.setItem('timerCount',String(count));

  localStorage.setItem('startNumber',String(start));

  const container = el('timers');

  container.innerHTML = '';

  for (let i=0;i<count;i++) {

    const num = start+i;

    const div = document.createElement('div');

    div.className = 'timer';

    div.innerHTML = `

      <button id="btn${num}" class="timerBtn waiting"

        data-status="waiting"

        onclick="handleButton(${num})">${num}</button>

      <button id="callBtn${num}" class="callBtn"

        onclick="callNumber(${num},this)">🔊 呼び出し</button>

      <div class="timeRow">

        <label for="time${num}">時間:</label>

        <select id="time${num}">

          <option value="600" selected>10分</option>

          <option value="1200">20分</option>

          <option value="1800">30分</option>

        </select>

      </div>

      <p id="display${num}" class="displayText">未開始</p>`;

    container.appendChild(div);

  }

  const extras = [

    ['refundBtn','refundBtn','refund500()','500円<br>返金','返金'],

    ['yen10000Btn','yenBtn','notifyYen10000()','一万円札','LINE通知'],

    ['changeCallBtn','changeBtn','notifyChange()','両替','LINE通知'],

    ['ownerCallBtn','ownerBtn','notifyOwner()','責任者<br>呼び出し','LINE通知']

  ];

  for (const [id,cls,action,label,caption] of extras) {

    const div = document.createElement('div');

    div.className = 'timer';

    div.innerHTML = `

      <button id="${id}" class="timerBtn ${cls}"

        onclick="${action}">${label}</button>

      <p class="displayText">${caption}</p>`;

    container.appendChild(div);

  }

  restoreVisibleTimers(start,count);

}

function handleButton(num) {

  const btn = el('btn'+num);

  if (!btn) return;

  const state = btn.getAttribute('data-status');

  if (state === 'waiting') startTimer(num);

  else if (state === 'running') cancelTimer(num);

  else if (state === 'finished') resetTimer(num);

}

function startTimer(num) {

  ensureCurrentDate();

  const seconds = parseInt(el('time'+num).value,10) || 600;

  const minutes = seconds/60;

  const price = getPrice(minutes);

  clearTimerHandles(num);

  removeCallsForNumber(num);

  if (minutes === 10) press10++;

  if (minutes === 20) press20++;

  if (minutes === 30) press30++;

  syncTodayToDailyStats();

  updateCountersDisplay();

  sendToSheet({

    type:'sale',ts:Date.now(),device:DEVICE_NAME,

    key:getItemKey(minutes),name:minutes+'分',

    unitPrice:price,qty:1,subtotal:price

  });

  const startedAt = Date.now();

  const endAt = startedAt+seconds*1000;

  timerStates[num] = {

    status:'running',startedAt,endAt,

    selectedValue:String(seconds),finishedAt:null,token:null,

    firstCallDone:false,secondCallDone:false

  };

  saveTimerStates();

  applyRunningState(num,endAt,String(seconds));

}

function applyRunningState(num,endAt,selectedValue) {

  const display = el('display'+num);

  const btn = el('btn'+num);

  const select = el('time'+num);

  if (!display || !btn) return;

  if (select && selectedValue) select.value = selectedValue;

  btn.className = 'timerBtn running';

  btn.setAttribute('data-status','running');

  display.style.color = 'black';

  display.classList.remove('displayUp');

  if (intervals[num]) clearInterval(intervals[num]);

  const tick = () => {

    const remain = Math.ceil((Number(endAt)-Date.now())/1000);

    if (remain > 0) {

      display.textContent = formatTime(remain);

      display.classList.toggle('blink',remain <= 30);

      return;

    }

    finishTimer(num,{

      finishedAt:Number(endAt),processCalls:true

    });

  };

  intervals[num] = setInterval(tick,1000);

  tick();

}

function finishTimer(num,options={}) {

  const display = el('display'+num);

  const btn = el('btn'+num);

  if (!display || !btn) return;

  const old = timerStates[num] || {};

  const finishedAt = Number(options.finishedAt)

    || Number(old.endAt) || Date.now();

  clearTimerHandles(num);

  display.textContent = '時間です！';

  display.classList.remove('blink');

  display.style.color = 'red';

  btn.className = 'timerBtn finished';

  btn.setAttribute('data-status','finished');

  const token = old.token || Date.now()+'_'+num+'_'+Math.random();

  activeCallToken[num] = token;

  timerStates[num] = {

    ...old,status:'finished',finishedAt,token,

    firstCallDone:Boolean(old.firstCallDone),

    secondCallDone:Boolean(old.secondCallDone)

  };

  saveTimerStates();

  startAfterCounter(num,finishedAt);

  if (options.processCalls !== false) processAutomaticCalls(num);

}

function startAfterCounter(num,finishedAt) {

  const display = el('display'+num);

  if (!display) return;

  if (afterIntervals[num]) clearInterval(afterIntervals[num]);

  const tick = () => {

    const seconds = Math.max(

      0,Math.floor((Date.now()-Number(finishedAt))/1000)

    );

    display.innerHTML = `終了後:<br>${formatTime(seconds)}`;

    display.classList.add('displayUp');

  };

  tick();

  afterIntervals[num] = setInterval(tick,1000);

}

function restoreOneTimer(num) {

  const state = timerStates[num];

  const btn = el('btn'+num);

  if (!state || !btn) return;

  if (state.status === 'running') {

    if (Number(state.endAt) > Date.now()) {

      applyRunningState(

        num,Number(state.endAt),state.selectedValue || '600'

      );

    } else {

      finishTimer(num,{

        finishedAt:Number(state.endAt),processCalls:true

      });

    }

  } else if (state.status === 'finished') {

    btn.className = 'timerBtn finished';

    btn.setAttribute('data-status','finished');

    if (!state.token) {

      state.token = Date.now()+'_'+num+'_'+Math.random();

    }

    activeCallToken[num] = state.token;

    saveTimerStates();

    el('display'+num).style.color = 'red';

    startAfterCounter(num,Number(state.finishedAt || Date.now()));

    processAutomaticCalls(num);

  }

}

function restoreVisibleTimers(start,count) {

  for (let i=0;i<count;i++) restoreOneTimer(start+i);

}

function reconcileAllTimers() {

  ensureCurrentDate();

  Object.keys(timerStates).forEach(key => {

    const num = Number(key);

    if (Number.isFinite(num)) restoreOneTimer(num);

  });

}

function resetTimer(num) {

  clearTimerHandles(num);

  removeCallsForNumber(num);

  delete timerStates[num];

  saveTimerStates();

  const btn = el('btn'+num);

  const display = el('display'+num);

  if (!btn || !display) return;

  btn.className = 'timerBtn waiting';

  btn.setAttribute('data-status','waiting');

  display.textContent = '未開始';

  display.style.color = 'black';

  display.classList.remove('blink','displayUp');

  if (el('time'+num)) el('time'+num).value = '600';

}

function cancelTimer(num) {

  resetTimer(num);

  ensureCurrentDate();

  cancelCount++;

  syncTodayToDailyStats();

  updateCountersDisplay();

}

function formatTime(seconds) {

  const s = Math.max(0,Number(seconds)||0);

  return `${Math.floor(s/60)}分${Math.floor(s%60)}秒`;

}

function changeDeviceName() {

  const name = prompt('端末名を入力してください',DEVICE_NAME);

  if (!name) return;

  DEVICE_NAME = name;

  localStorage.setItem('deviceName',name);

  setText('deviceLabel','端末名：'+name);

  alert('端末名を変更しました\n\n'+name);

}

function savePlayMode() {

  localStorage.setItem('playMode',el('playMode').value);

}

window.addEventListener('load', () => {

  currentDateKey = getTodayKey();

  loadDailyStats();

  loadTimerStates();

  const count = localStorage.getItem('timerCount');

  const start = localStorage.getItem('startNumber');

  if (count) el('timerCount').value = count;

  if (start) el('startNumber').value = start;

  loadTodayCountersFromDailyStats();

  el('playMode').value = localStorage.getItem('playMode') || 'fuwafuwa';

  setText('deviceLabel','端末名：'+DEVICE_NAME);

  generateTimers();

  el('summaryDate').value = currentDateKey;

  updateDailySummaryView(currentDateKey);

  el('summaryDate').addEventListener('change', () => {

    updateDailySummaryView(el('summaryDate').value || currentDateKey);

  });

  updateNetworkStatus();

  flushOfflineQueue(false);

  reconcileAllTimers();

});

document.addEventListener('visibilitychange', () => {

  if (!document.hidden) reconcileAllTimers();

});

window.addEventListener('focus',reconcileAllTimers);

window.addEventListener('pageshow',reconcileAllTimers);

Object.assign(window,{

  generateTimers,handleButton,showSales,hideSales,refund500,

  notifyYen10000,notifyOwner,notifyChange,changeDeviceName,

  savePlayMode,callNumber,flushOfflineQueue

});

</script>

<script>

// 音声再生・オフライン保存

(() => {

  'use strict';

  const CACHE = 'bb-timer-audio-v20261010';

  let ctx = null;

  const buffers = new Map();

  const loads = new Map();

  let runner = null;

  let generation = 0;

  let stopPlayback = null;

  let playingMessage = false;

  let prepareBusy = false;

  let messageEnabled =

    localStorage.getItem('bbMessageAudioEnabled') !== 'false';

  function status(text) {

    const node = document.getElementById('audioStatus');

    if (node) node.textContent = text;

  }

  function context() {

    if (!ctx || ctx.state === 'closed') {

      const AudioContextClass =

        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {

        throw new Error('この端末はWeb Audioに対応していません');

      }

      ctx = new AudioContextClass();

    }

    return ctx;

  }

  function unlock() {

    try {

      const c = context();

      const resumed = c.resume();

      const source = c.createBufferSource();

      source.buffer = c.createBuffer(1,1,c.sampleRate);

      source.connect(c.destination);

      source.start(0);

      return Promise.resolve(resumed);

    } catch (error) {

      status(error.message);

      return Promise.reject(error);

    }

  }

  async function loadBuffer(file,requirePersistent=false) {

    const url = new URL(file,document.baseURI).href;

    if (buffers.has(url) && !requirePersistent) {

      return buffers.get(url);

    }

    if (loads.has(url) && !requirePersistent) {

      return loads.get(url);

    }

    const work = (async () => {

      let cache = null;

      if ('caches' in window) {

        try { cache = await caches.open(CACHE); } catch (_) {}

      }

      if (requirePersistent && !cache) {

        throw new Error(

          '端末への保存が利用できません。HTTPSで開いてください'

        );

      }

      let response = cache ? await cache.match(url) : null;

      let fromCache = Boolean(response);

      async function decode(res) {

        if (!res || !res.ok || res.status === 206) {

          throw new Error(file+'を取得できません');

        }

        return context().decodeAudioData(

          await res.clone().arrayBuffer()

        );

      }

      let buffer;

      if (response) {

        try {

          buffer = await decode(response);

        } catch (_) {

          await cache.delete(url);

          response = null;

          fromCache = false;

        }

      }

      if (!response) {

        if (!navigator.onLine) {

          throw new Error(file+'が端末に保存されていません');

        }

        const controller = new AbortController();

        const timeout = setTimeout(() => controller.abort(),20000);

        try {

          response = await fetch(url,{

            cache:'no-store',signal:controller.signal

          });

          buffer = await decode(response);

        } finally {

          clearTimeout(timeout);

        }

      }

      if (cache && !fromCache) {

        try {

          await cache.put(url,response.clone());

        } catch (error) {

          if (requirePersistent) throw error;

        }

      }

      buffers.set(url,buffer);

      return buffer;

    })();

    loads.set(url,work);

    try {

      return await work;

    } finally {

      if (loads.get(url) === work) loads.delete(url);

    }

  }

  async function loadChoice(files,persistent=false) {

    let lastError;

    for (const file of (Array.isArray(files) ? files : [files])) {

      try {

        return await loadBuffer(file,persistent);

      } catch (error) {

        lastError = error;

      }

    }

    throw lastError;

  }

  function valid(task,epoch) {

    return !task.cancelled && epoch === generation

      && (!task.requireFinished || isStillFinished(task.num,task.token));

  }

  async function playChoice(choice,task,epoch) {

    const buffer = await loadChoice(choice);

    if (!valid(task,epoch)) return false;

    if (playingMessage && !messageEnabled) return false;

    const c = context();

    if (c.state !== 'running') {

      throw new Error('「音声を準備・有効化」を押してください');

    }

    return new Promise((resolve,reject) => {

      const source = c.createBufferSource();

      source.buffer = buffer;

      source.connect(c.destination);

      let done = false;

      let watchdog;

      const finish = ok => {

        if (done) return;

        done = true;

        clearTimeout(watchdog);

        source.onended = null;

        try { source.stop(); } catch (_) {}

        source.disconnect();

        if (stopPlayback === cancel) stopPlayback = null;

        currentAudio = null;

        currentFinish = null;

        resolve(ok);

      };

      const cancel = () => finish(false);

      stopPlayback = cancel;

      currentFinish = cancel;

      currentAudio = {pause:cancel,currentTime:0};

      source.onended = () => finish(true);

      watchdog = setTimeout(

        () => finish(false),

        Math.max(5000,buffer.duration*1000+5000)

      );

      try {

        source.start(0);

      } catch (error) {

        cancel();

        reject(error);

      }

    });

  }

  function toggleLabel() {

    const btn = document.getElementById('messageAudioBtn');

    if (!btn) return;

    btn.textContent = '案内音声：'+(messageEnabled ? 'ON' : 'OFF');

    btn.setAttribute('aria-pressed',String(messageEnabled));

    btn.style.background = messageEnabled ? '#087a08' : '#666';

  }

  function toggleMessage() {

    messageEnabled = !messageEnabled;

    localStorage.setItem('bbMessageAudioEnabled',String(messageEnabled));

    toggleLabel();

    if (!messageEnabled && playingMessage && stopPlayback) {

      stopPlayback();

    }

  }

  async function prepare() {

    if (prepareBusy) return;

    const ready = unlock();

    prepareBusy = true;

    const btn = document.getElementById('prepareAudioBtn');

    btn.disabled = true;

    const missing = [];

    const count = parseInt(

      document.getElementById('timerCount').value,10

    ) || 0;

    const start = parseInt(

      document.getElementById('startNumber').value,10

    ) || 1;

    const files = Array.from(

      {length:count},(_,i) => `${start+i}.wav`

    );

    const choices = [

      ...files,

      ['bubble.wav','バブル.wav'],

      ['fuwafuwa.wav','ふわふわ.wav']

    ];

    try {

      await ready;

      for (let i=0;i<choices.length;i++) {

        status(`音声を保存・確認中 ${i+1}/${choices.length}`);

        try {

          await loadChoice(choices[i],true);

        } catch (_) {

          missing.push(

            Array.isArray(choices[i]) ? choices[i][0] : choices[i]

          );

        }

      }

      if (missing.length) {

        status(

          '保存・確認できなかった音声：'+missing.join('、')

          +'。オンラインで再確認してください'

        );

      } else {

        status(

          `音声準備完了：番号${count}件＋案内2件（オフライン再生用）`

        );

      }

      reconcileAllTimers();

    } catch (error) {

      status(error.message);

    } finally {

      prepareBusy = false;

      btn.disabled = false;

    }

  }

  runAudioQueue = function() {

    if (runner) return runner;

    audioPlaying = true;

    runner = (async () => {

      while (audioQueue.length) {

        const task = audioQueue.shift();

        const epoch = generation;

        if (!valid(task,epoch)) continue;

        currentTask = task;

        updateCallButtonStates();

        let success = false;

        try {

          const numberOK = await playChoice(

            `${task.num}.wav`,task,epoch

          );

          if (!numberOK) {

            if (valid(task,epoch)) {

              status(

                '番号音声を再生できませんでした。'

                +'「音声を準備・有効化」で再試行してください'

              );

            }

          } else if (valid(task,epoch)) {

            success = true;

            const state = timerStates[task.num];

            if (task.requireFinished && state && state.token === task.token) {

              if (task.callKind === 'first') state.firstCallDone = true;

              if (task.callKind === 'second') state.secondCallDone = true;

              saveTimerStates();

            }

            if (task.callKind === 'first' && messageEnabled) {

              playingMessage = true;

              try {

                await playChoice(task.messageFiles,task,epoch);

              } catch (_) {

                status('番号は再生済みです。案内音声を確認してください');

              } finally {

                playingMessage = false;

              }

            }

          }

        } catch (error) {

          status('音声エラー：'+error.message);

        } finally {

          playingMessage = false;

          currentTask = null;

          updateCallButtonStates();

        }

        if (success && task.callKind === 'first' && valid(task,epoch)) {

          processAutomaticCalls(task.num);

        }

        await sleep(AUDIO_GAP_MS);

      }

    })().finally(() => {

      runner = null;

      audioPlaying = false;

      updateCallButtonStates();

      if (audioQueue.length) runAudioQueue();

    });

    return runner;

  };

  function pending(num,token,kind) {

    const same = t => t && t.num === num

      && t.token === token && t.callKind === kind;

    return same(currentTask) || audioQueue.some(same);

  }

  enqueueFirstEndCall = function(num,token) {

    if (pending(num,token,'first')) return;

    enqueueAudioTask({

      num,token,manual:false,requireFinished:true,

      callKind:'first',messageFiles:messageFilesForMode()

    });

  };

  enqueueSecondEndCall = function(num,token) {

    if (pending(num,token,'second')) return;

    enqueueAudioTask({

      num,token,manual:false,requireFinished:true,

      callKind:'second'

    });

  };

  processAutomaticCalls = function(num) {

    const state = timerStates[num];

    const btn = document.getElementById('btn'+num);

    if (!state || state.status !== 'finished' || !btn

      || btn.getAttribute('data-status') !== 'finished') return;

    if (!state.token) {

      state.token = Date.now()+'_'+num+'_'+Math.random();

    }

    activeCallToken[num] = state.token;

    saveTimerStates();

    if (!state.firstCallDone) {

      enqueueFirstEndCall(num,state.token);

    }

    const due = Number(state.finishedAt)+SECOND_CALL_DELAY_MS;

    if (state.firstCallDone && !state.secondCallDone && Date.now() >= due) {

      enqueueSecondEndCall(num,state.token);

    }

    if (!state.secondCallDone && Date.now() < due) {

      scheduleSecondCall(num);

    }

  };

  const originalGenerateTimers = generateTimers;

  generateTimers = function() {

    generation++;

    if (stopPlayback) stopPlayback();

    originalGenerateTimers();

    audioPlaying = Boolean(runner);

    status(

      '番号を変更したときは、オンラインで'

      +'「音声を準備・有効化」を押してください'

    );

  };

  window.generateTimers = generateTimers;

  const originalRemoveCalls = removeCallsForNumber;

  removeCallsForNumber = function(num) {

    if (currentTask && currentTask.num === num) {

      currentTask.cancelled = true;

      if (stopPlayback) stopPlayback();

    }

    originalRemoveCalls(num);

  };

  document.addEventListener('click', () => {

    unlock().then(() => {

      if (!document.hidden) reconcileAllTimers();

    }).catch(() => {});

  },true);

  window.addEventListener('load', () => {

    const panel = document.createElement('div');

    panel.style.cssText =

      'margin:10px 4px;padding:12px;background:#eef5ff;'

      +'border:2px solid #2196f3;border-radius:12px;';

    panel.innerHTML =

      '<button type="button" id="prepareAudioBtn">音声を準備・有効化</button> '

      +'<button type="button" id="messageAudioBtn" aria-pressed="true"></button>'

      +'<p style="margin:8px 0">案内音声は bubble.wav／fuwafuwa.wav です。OFFでも番号は鳴ります。</p>'

      +'<p id="audioStatus" role="status" aria-live="polite">オンラインで音声を準備してください。</p>';

    document.getElementById('controls').after(panel);

    for (const id of ['prepareAudioBtn','messageAudioBtn']) {

      document.getElementById(id).style.cssText =

        'font-size:20px;padding:10px 14px;border-radius:10px;'

        +'color:white;background:#1565c0;margin:4px;';

    }

    document.getElementById('prepareAudioBtn')

      .addEventListener('click',prepare);

    document.getElementById('messageAudioBtn')

      .addEventListener('click',toggleMessage);

    toggleLabel();

  });

})();

</script>
